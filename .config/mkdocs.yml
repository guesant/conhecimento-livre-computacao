site_name: conhecimento-livre-computacao
site_description: Base aberta e livre de conhecimento sobre Ciência da Computação, com tutoriais, guias, cheatsheets e referências
site_url: https://guesant.github.io/conhecimento-livre-computacao/
repo_url: https://github.com/guesant/conhecimento-livre-computacao
repo_name: guesant/conhecimento-livre-computacao
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: ../.build/site

exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font:
    text: Roboto Slab
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

extra_css:
  - overrides/extra.css

